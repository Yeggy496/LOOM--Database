<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOM · 样本工作台</title>
<style>
:root{color-scheme:light;--paper:#f5f4ee;--ink:#20382f;--muted:#65746b;--line:#dce1d8;--accent:#dd5e36;--light:#e6eddf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{padding:28px 5vw 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px}header strong{font-size:30px;letter-spacing:5px}header span{color:var(--muted)}.badge{margin-left:auto;border:1px solid var(--line);padding:5px 12px;border-radius:99px;font-size:12px}main{max-width:1480px;margin:auto;padding:32px 4vw}.intro{display:flex;align-items:end;gap:24px;margin-bottom:28px}.intro h1{font-size:36px;letter-spacing:-1px;line-height:1.3;margin:0 0 10px}.intro p{color:var(--muted);margin:0;max-width:680px}.stats{margin-left:auto;display:flex;gap:28px;white-space:nowrap}.stats b{display:block;font-size:30px;line-height:1.3}.stats small{color:var(--muted)}.layout{display:grid;grid-template-columns:200px minmax(260px,1fr) minmax(300px,1.1fr);gap:24px}aside{padding-right:18px}label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}input,select,button{font:inherit}input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.filter{margin:0 0 20px}.help{font-size:12px;color:var(--muted);margin-top:20px}button{cursor:pointer;color:var(--ink);border:1px solid var(--line);border-radius:7px;background:white;padding:8px 12px}button:hover{background:var(--light)}#download{width:100%;margin-top:10px}.listhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;color:var(--muted);font-size:13px}.cards{max-height:calc(100vh - 300px);min-height:350px;overflow:auto;padding:2px 6px 10px 2px}.card{display:block;text-align:left;width:100%;border-radius:9px;border:1px solid var(--line);background:#fff;padding:17px 18px;margin-bottom:10px;transition:border-color .12s}.card:hover,.card[aria-pressed=true]{border-color:var(--ink)}.card[aria-pressed=true]{box-shadow:inset 3px 0 var(--accent)}.card h2{font-size:16px;margin:5px 0 8px}.card p{font-size:13px;color:var(--muted);margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.eyebrow{font-size:11px;letter-spacing:.5px;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:2px 8px;background:var(--light);border-radius:4px}.detail{background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px;align-self:start;max-height:calc(100vh - 280px);overflow:auto}.detail h2{font-size:25px;line-height:1.4;margin:7px 0 16px}.detail h3{font-size:12px;letter-spacing:1px;margin:25px 0 8px;color:var(--muted)}.raw{white-space:pre-wrap;overflow-wrap:anywhere;padding:15px 18px;background:#f4f5ef;border-left:3px solid #aab99f;margin:0}.summary{white-space:pre-wrap}.detail a{color:#326c52;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.notice{font-size:12px;background:#fff2e8;color:#8a452a;border-radius:6px;padding:10px 12px;margin:18px 0 0}.empty{padding:35px 10px;color:var(--muted)}footer{max-width:1480px;padding:10px 4vw 30px;margin:auto;font-size:12px;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:170px 1fr}.detail{grid-column:1/-1;max-height:none}.cards{max-height:550px}.intro{align-items:start}.stats{gap:15px}}@media(max-width:620px){header{padding:18px 5vw;flex-wrap:wrap}.badge{display:none}.intro{display:block}.intro h1{font-size:28px}.stats{margin:20px 0;gap:30px}.layout{display:block}aside{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0}.filter{margin-bottom:5px}.help{grid-column:1/-1;margin:4px 0 14px}#download{margin:0 0 20px}.detail{margin-top:20px}.cards{max-height:480px}}
</style>
<header><strong>LOOM</strong><span>样本工作台 / Database</span><span class="badge">独立整理 · 离线可用</span></header>
<main><section class="intro"><div><h1>把零散想法，整理成可检验的数据。</h1><p>查看原文、候选整理和来源。公开参考与模拟速记分别展示，每条标注都保留复核状态。</p></div><div class="stats"><div><b id="total">—</b><small>全部样本</small></div><div><b id="public">—</b><small>公开摘录</small></div><div><b id="synthetic">—</b><small>模拟速记</small></div></div></section>
<section class="layout"><aside aria-label="样本筛选">
<div class="filter"><label for="query">搜索内容</label><input id="query" placeholder="例如：离线、事务、Vue" type="search"></div>
<div class="filter"><label for="origin">样本来源</label><select id="origin"><option value="">全部来源</option value="public_excerpt">公开参考摘录</option><option value="synthetic">模拟速记</option></select></div>
<div class="filter"><label for="category">内容类别</label><select id="category"><option value="">全部类别</option><option value="knowledge">知识</option><option value="idea">想法</option><option value="question">问题</option><option value="task">任务</option><option value="event">活动</option></select></div>
<div class="filter"><label for="language">原文语言</label><select id="language"><option value="">全部语言</option><option value="zh">中文</option><option value="en">英文</option></select></div>
<div class="filter"><label for="review">复核状态</label><select id="review"><option value="">全部状态</option><option value="pending">待人工复核</option><option value="verified">人工已确认</option><option value="rejected">人工已拒绝</option></select></div>
<div class="filter"><label for="split">数据分组</label><select id="split"><option value="">全部分组</option><option value="dev">开发集</option><option value="test">测试集</option></select></div>
<button id="reset" type="button">重置筛选</button><button id="download" type="button">导出筛选结果</button><p class="help">此页使用关键词过滤。模拟文本用于功能演示；候选摘要与分类仍需人工确认。</p></aside>
<section aria-label="样本列表"><div class="listhead"><span id="count" aria-live="polite"></span><span>选择一条查看详情 ↗</span></div><div class="cards" id="cards"></div></section>
<article class="detail" id="detail" aria-label="样本详情"></article></section></main>
<footer>LOOM--Database · 未调用外部模型 · 样本用途及来源许可请查看仓库文档。此页面为只读快照。</footer>
<script id="corpus" type="application/json">__CORPUS_JSON__</script>
<script>
const corpus=JSON.parse(document.getElementById('corpus').textContent),all=corpus.records;
const $=id=>document.getElementById(id),categoryNames={knowledge:'知识',idea:'想法',question:'问题',task:'任务',event:'活动'},reviewNames={pending:'待人工复核',verified:'人工已确认',rejected:'人工已拒绝'};
let filtered=all,selected=null;
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function tagList(r){const box=node('div',undefined,'tags');r.tags.forEach(t=>box.append(node('span',t,'tag')));return box}
function show(r){selected=r.id;document.querySelectorAll('.card').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.id===selected)));const d=$('detail');d.replaceChildren(node('div',r.id+' · '+(r.origin==='synthetic'?'模拟速记':'公开参考'),'eyebrow'),node('h2',r.title),tagList(r));d.append(node('h3',r.origin==='synthetic'?'模拟原文':'来源原文短摘录'),node('blockquote',r.body,'raw'),node('h3','候选中文整理 · '+reviewNames[r.review_status]),node('div',r.summary_zh,'summary'),node('p','类别：'+categoryNames[r.category]+' · 标注版本 '+r.revision,'meta'));if(r.url){d.append(node('h3','来源与定位'),node('p',r.author,'meta'));const link=node('a','打开原始页面 ↗');link.href=r.url;link.target='_blank';link.rel='noopener noreferrer';d.append(link,node('p',r.locator,'meta'),node('p','许可：'+(r.license_name||'尚未单独确认')+' · 采集于 '+r.collected_on,'meta'));}else d.append(node('p','由本项目编写的模拟场景，不对应真实用户、真实录音或手写识别结果。','notice'));d.append(node('h3','来源核查'),node('p',r.source_checks.length?r.source_checks.map(c=>c.checked_on+' · '+(c.checker_type==='human'?'人工':'AI 辅助')+'核对').join('；'):'模拟文本无需公开网页核查。','meta'),node('p','分组：'+r.split+' · '+r.group_key,'meta'),node('p','原文指纹：'+r.body_sha256,'meta'));if(r.review_status==='pending')d.append(node('p','当前摘要、分类及标签为候选标注，不能视为人工标准答案。','notice'));}
function render(){const q=$('query').value.trim().toLocaleLowerCase();filtered=all.filter(r=>(!$('origin').value||r.origin===$('origin').value)&&(!$('category').value||r.category===$('category').value)&&(!$('language').value||r.language===$('language').value)&&(!$('review').value||r.review_status===$('review').value)&&(!$('split').value||r.split===$('split').value)&&(!q||[r.title,r.body,r.summary_zh,r.author||'',...r.tags].join(' ').toLocaleLowerCase().includes(q)));$('count').textContent='显示 '+filtered.length+' / '+all.length+' 条';$('cards').replaceChildren();if(!filtered.length){$('cards').append(node('p','没有匹配的样本，可以缩短关键词或重置筛选。','empty'));$('detail').replaceChildren(node('p','请选择一条样本。','empty'));return}filtered.forEach(r=>{const c=node('button',undefined,'card');c.type='button';c.dataset.id=r.id;c.setAttribute('aria-pressed','false');c.append(node('div',r.id+' · '+(r.origin==='synthetic'?'模拟速记':'公开参考')+' · '+categoryNames[r.category],'eyebrow'),node('h2',r.title),node('p',r.body),tagList(r));c.addEventListener('click',()=>show(r));$('cards').append(c)});show(filtered.find(r=>r.id===selected)||filtered[0]);}
['query','origin','category','language','review','split'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',render));$('reset').addEventListener('click',()=>{['query','origin','category','language','review','split'].forEach(id=>$(id).value='');render()});$('download').addEventListener('click',()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({...corpus,dataset_sha256:null,subset_of_dataset_sha256:corpus.dataset_sha256,records:filtered},null,2)],{type:'application/json'}));a.href=u;a.download='loom-selected.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});$('total').textContent=all.length;$('public').textContent=all.filter(r=>r.origin==='public_excerpt').length;$('synthetic').textContent=all.filter(r=>r.origin==='synthetic').length;render();
</script></html>
